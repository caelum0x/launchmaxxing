[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "launchmaxxing"
version = "0.1.0"
description = "A founder's first-100-users toolkit: launch directories, a distribution checklist, Reddit pain-point search and competitor backlink lookup -- all local, no account required."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Menivor" }]
keywords = ["launch", "product-hunt", "distribution", "growth", "indie-hackers", "startup", "founders", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.urls]
Homepage = "https://github.com/caelum0x/launchmaxxing"
Repository = "https://github.com/caelum0x/launchmaxxing"

[project.scripts]
launchmaxxing = "launchmaxxing.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/launchmaxxing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
